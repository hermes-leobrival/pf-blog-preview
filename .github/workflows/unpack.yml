name: unpack-astro-site
on:
  push:
    branches: [astro-redesign]
    paths: ['.github/workflows/unpack.yml']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/astro-redesign'
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site sources (one-time import)
        run: |
          test -f site.b64
          base64 -d site.b64 > site.zip
          rm -f ./*.html
          unzip -q -o site.zip -x '.github/*'
          rm -f site.zip site.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import Astro redesign sources" || echo "nothing to commit"
          git push
