name: chore-remove-unused-deps
on:
  push:
    branches: [astro-redesign]
    paths: ['.github/workflows/chore-deps.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/astro-redesign'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm uninstall --ignore-scripts @fontsource-variable/geist tsx
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: remove unused dependencies reported by Knip" || echo "nothing to commit"
          git push
